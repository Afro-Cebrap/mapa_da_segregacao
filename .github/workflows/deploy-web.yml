name: Deploy Web (Firebase Hosting)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # The map now reads pre-generated tiles and JSON from the public data
      # bucket instead of the retired Cloud Run backend, so the build no
      # longer needs to authenticate to GCP to resolve a service URL.
      - name: Build
        working-directory: app
        env:
          VITE_DATA_URL: https://storage.googleapis.com/mapa-da-segregacao-dados
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install Firebase CLI
        run: bun add -g firebase-tools

      - name: Deploy to Firebase Hosting
        working-directory: app
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set +e
          OUT=$(firebase deploy --only hosting --project ${{ vars.FIREBASE_PROJECT }} --non-interactive 2>&1)
          CODE=$?
          echo "$OUT"
          # firebase-tools sai com erro quando a versao publicada ja virou a
          # ativa (release redundante). Isso significa que o conteudo esta no
          # ar; tratamos apenas esse caso especifico como sucesso.
          if [ $CODE -ne 0 ] && echo "$OUT" | grep -q "is the current active version"; then
            echo "::warning::Release redundante (versao ja ativa); tratando como sucesso."
            exit 0
          fi
          exit $CODE
